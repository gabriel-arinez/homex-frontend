name: Temporary PDF.js dependency lock
on:
  push:
    branches:
      - feat/perfeccionamiento-documento-pdf
permissions:
  contents: write
jobs:
  install:
    if: contains(github.event.head_commit.message, '[setup-pdfjs]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/perfeccionamiento-documento-pdf
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm install pdfjs-dist@6.5.438 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Push dependency lock
        run: |
          git config user.name homex-ci
          git config user.email homex-ci@users.noreply.github.com
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(pdf): add locked PDF.js rendering dependency'
            git push origin HEAD:feat/perfeccionamiento-documento-pdf
          fi
