name: Temporary PDF formatter
on:
  push:
    branches:
      - feat/perfeccionamiento-documento-pdf
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[run-pdf-formatter]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/perfeccionamiento-documento-pdf
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/modules/proformas/components/DocumentViewerModal.vue src/modules/proformas/components/DocumentViewerModal.test.ts src/modules/proformas/views/ProformaDetailView.vue src/modules/proformas/views/ProformaEditorView.vue src/modules/proformas/composables/useProformaPdf.ts
      - name: Push only formatting changes
        run: |
          git config user.name 'homex-ci'
          git config user.email 'homex-ci@users.noreply.github.com'
          git add src/modules/proformas/components/DocumentViewerModal.vue src/modules/proformas/components/DocumentViewerModal.test.ts src/modules/proformas/views/ProformaDetailView.vue src/modules/proformas/views/ProformaEditorView.vue src/modules/proformas/composables/useProformaPdf.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(pdf): apply Prettier to unified document viewer'
            git push origin HEAD:feat/perfeccionamiento-documento-pdf
          fi
