name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  VITE_API_BASE_URL: http://localhost:8000

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.12.0, cache: npm }
      - run: npm ci
      - run: npm run type-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.12.0, cache: npm }
      - run: npm ci
      - run: npm run lint:check

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.12.0, cache: npm }
      - run: npm ci
      - run: npm run format:check

  unit-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.12.0, cache: npm }
      - run: npm ci
      - run: npm run test:unit -- --run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.12.0, cache: npm }
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.12.0, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y

  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.12.0, cache: npm }
      - run: npm ci
      - run: npm run contract:check

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.12.0, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high

  integration-real:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homex_fe08
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: homex_fe08
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VITE_API_BASE_URL: http://127.0.0.1:8000
      DJANGO_SECRET_KEY: fe08-integration-secret-with-at-least-thirty-two-characters
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4174
      DATABASE_URL: postgresql://postgres:homex_fe08@127.0.0.1:5432/homex_fe08
      CELERY_BROKER_URL: redis://127.0.0.1:6379/14
      DJANGO_SETTINGS_MODULE: config.settings.integration
      HOMEX_ASR_DEVICE: cpu
      HOMEX_ASR_COMPUTE_TYPE: int8
      HOMEX_AUDIO_TTL_SECONDS: 3600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gabriel-arinez/homex-backend
          ref: 96e5afd0c3bd0e5c75ddd5469313ac2e79cdad7e
          path: backend
      - uses: actions/setup-node@v4
        with: { node-version: 24.12.0, cache: npm }
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/cache@v4
        with:
          path: .cache/fe08-asr
          key: faster-whisper-base-v1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv sync --project backend --locked --extra dev --extra worker
      - name: Install deterministic speech fixture generator
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - name: Prepare PostgreSQL, user and catalog fixture
        run: |
          cd backend
          uv run python manage.py migrate --noinput
          uv run python ../scripts/seed-fe08-backend.py
      - name: Prepare local ASR model and ephemeral audio
        env:
          HOMEX_ASR_MODEL_PATH: ${{ github.workspace }}/.cache/fe08-asr
          FE08_AUDIO_FIXTURE: ${{ runner.temp }}/cotizacion-fe08.wav
        run: |
          cd backend
          uv run python ../scripts/download-fe08-asr-model.py "$HOMEX_ASR_MODEL_PATH"
          espeak-ng -v es-la -s 115 -g 10 -w "$FE08_AUDIO_FIXTURE" "tres mesas, total cien bolivianos"
      - name: Start API, worker and outbox publisher
        env:
          HOMEX_ASR_MODEL_PATH: ${{ github.workspace }}/.cache/fe08-asr
          HOMEX_AUDIO_TEMP_ROOT: ${{ runner.temp }}/homex-audio-fe08
        run: |
          mkdir -p "$HOMEX_AUDIO_TEMP_ROOT"
          cd backend
          uv run celery -A config worker --pool=solo --loglevel=INFO > "$RUNNER_TEMP/fe08-worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fe08-worker.pid"
          uv run celery -A config beat --loglevel=INFO > "$RUNNER_TEMP/fe08-beat.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fe08-beat.pid"
          uv run python manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/fe08-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fe08-api.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/ >/dev/null && \
               uv run celery -A config inspect ping --timeout=1 | grep -q pong; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/fe08-api.log" "$RUNNER_TEMP/fe08-worker.log" "$RUNNER_TEMP/fe08-beat.log"
          exit 1
      - name: Playwright against real HOMEX stack
        env:
          FE08_AUDIO_FIXTURE: ${{ runner.temp }}/cotizacion-fe08.wav
        run: npm run test:integration
      - name: Verify PostgreSQL evidence and audio deletion
        env:
          HOMEX_ASR_MODEL_PATH: ${{ github.workspace }}/.cache/fe08-asr
          HOMEX_AUDIO_TEMP_ROOT: ${{ runner.temp }}/homex-audio-fe08
        run: |
          cd backend
          uv run python ../scripts/verify-fe08-backend.py
      - name: Upload integration evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fe08-real-integration-evidence
          path: |
            test-results/playwright-integration/
            ${{ runner.temp }}/fe08-api.log
            ${{ runner.temp }}/fe08-worker.log
            ${{ runner.temp }}/fe08-beat.log
          if-no-files-found: ignore
          retention-days: 7
