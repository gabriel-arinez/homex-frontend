name: Temporary productos formatter
on:
  push:
    branches:
      - feat/productos-bandeja-ux-20261103
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format changed productos files
        run: |
          npx prettier --write \
            src/modules/productos/views/ProductosListView.vue \
            src/modules/productos/utils/presentacionCatalogo.ts \
            src/tests/fe03/productos-presentacion.spec.ts \
            src/tests/fe03/productos-bandeja.spec.ts \
            src/tests/e2e/fe03-clientes-productos.spec.ts \
            src/tests/e2e/fe035-usabilidad-nielsen.spec.ts \
            src/tests/e2e/productos-bandeja-ux.spec.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/modules/productos/views/ProductosListView.vue src/modules/productos/utils/presentacionCatalogo.ts src/tests/fe03/productos-presentacion.spec.ts src/tests/fe03/productos-bandeja.spec.ts src/tests/e2e/fe03-clientes-productos.spec.ts src/tests/e2e/fe035-usabilidad-nielsen.spec.ts src/tests/e2e/productos-bandeja-ux.spec.ts
            git commit -m "style(productos): aplicar Prettier [formatted]"
            git push origin HEAD:feat/productos-bandeja-ux-20261103
          fi
