name: Formatear panel compartido voz (temporal)
on:
  push:
    branches: [feat/voz-panel-unificado-20261105]
permissions:
  contents: write
jobs:
  format:
    if: "github.event.head_commit.message == 'chore(ci): formatear panel de voz'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/voz-panel-unificado-20261105
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write \
            src/modules/capturas/components/VoiceCaptureControls.vue \
            src/modules/capturas/components/VoiceDrawer.vue \
            src/modules/productos/components/CapturaCatalogo.vue \
            src/tests/e2e/fe04-proformas.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/capturas/components/VoiceCaptureControls.vue src/modules/capturas/components/VoiceDrawer.vue src/modules/productos/components/CapturaCatalogo.vue src/tests/e2e/fe04-proformas.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(voz): aplicar Prettier a componentes compartidos"
            git push origin HEAD:feat/voz-panel-unificado-20261105
          fi
