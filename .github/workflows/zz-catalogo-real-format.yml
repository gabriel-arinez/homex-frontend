name: Formato temporal de pruebas de catálogo
on:
  push:
    branches: [feat/productos-bandeja-ux-20261103]
permissions:
  contents: write
jobs:
  format:
    if: "github.event.head_commit.message == 'chore(ci): ejecutar formateo de prueba real de catálogo'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/productos-bandeja-ux-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/tests/integration/catalogo-real.spec.ts
      - name: Guardar el formato corregido
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tests/integration/catalogo-real.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(catalogo): formatear pruebas reales del editor"
            git push origin HEAD:feat/productos-bandeja-ux-20261103
          fi
