name: HOMEX Temporary Contract Generator
on:
  push:
    branches:
      - feat/ux-proformas-20261101
    paths:
      - .github/workflows/homex-temp-contract.yml
jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-proformas-20261101
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci
      - name: Generate exact OpenAPI types
        run: npm run api:generate
      - name: Format only modified application and contract files
        run: |
          npx prettier --write src/generated/api src/shared/validation/commercialFields.ts src/shared/ui/TextField.vue src/shared/ui/Toast.vue src/shared/ui/ConfirmDialog.vue src/modules/clientes/components/ClienteFormFields.vue src/modules/clientes/views/ClienteCreateView.vue src/modules/clientes/views/ClienteDetailView.vue src/modules/clientes/services/clientesService.ts src/modules/proformas/components/ClienteSelector.vue src/modules/proformas/views/ProformaEditorView.vue src/tests/fe04/commercialFields.spec.ts src/tests/e2e/fe04-proformas.spec.ts src/tests/e2e/fe03-clientes-productos.spec.ts src/tests/ap4/clientes.spec.ts src/tests/fe04/proformas.spec.ts
      - name: Commit generated and formatted files
        run: |
          git config user.name "homex-contract-generator"
          git config user.email "homex-contract-generator@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "chore(frontend): regenerar OpenAPI y normalizar formularios"
            git push origin HEAD:feat/ux-proformas-20261101
          fi
