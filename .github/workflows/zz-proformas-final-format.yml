name: Temporary final Proformas formatter

on:
  push:
    branches:
      - feat/proformas-bandeja-ux-20261102

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          npx prettier --write \
            src/modules/proformas/views/ProformasListView.vue \
            src/modules/proformas/components/ProformaActionsMenu.vue \
            src/tests/fe04/proformas-bandeja.spec.ts \
            src/tests/fe04/proformas.spec.ts \
            src/tests/e2e/fe04-proformas.spec.ts \
            .github/workflows/zz-proformas-final-format.yml
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style(proformas): Prettier final [formatted]"
            git push origin HEAD:feat/proformas-bandeja-ux-20261102
          fi
