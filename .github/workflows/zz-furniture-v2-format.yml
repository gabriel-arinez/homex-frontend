name: Furniture Studio v2 - Formato temporal
on:
  push:
    branches: [feat/furniture-studio-20261102]
permissions:
  contents: write
jobs:
  format-once:
    if: "github.event.head_commit.message == 'chore(ci): lanzar formato automatico de Furniture Studio 2.0'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/furniture-studio-20261102
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Aplicar Prettier al codigo y pruebas del rediseño
        run: |
          npx prettier --write \
            src/modules/proformas/components/MuebleStudio.vue \
            src/modules/proformas/components/EspecificacionForm.vue \
            src/modules/proformas/components/MuebleOptionPicker.vue \
            src/modules/proformas/components/CapturaAsistida.vue \
            src/modules/proformas/views/ProformaEditorView.vue \
            src/modules/capturas/components/AudioRecorder.vue \
            src/modules/capturas/composables/useAudioRecorder.ts \
            src/tests/e2e/fe04-proformas.spec.ts \
            src/tests/integration/prf04-real.spec.ts \
            src/tests/integration/fe08-real.spec.ts \
            src/tests/prf03/mueble-option-picker.spec.ts \
            src/tests/prf04/furniture-studio-voice-review.spec.ts \
            src/tests/prf04/carga-audio.spec.ts \
            docs/implementacion/PRF03_FURNITURE_STUDIO.md
      - name: Subir commit de formato si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/proformas src/modules/capturas src/tests/e2e/fe04-proformas.spec.ts src/tests/integration src/tests/prf03/mueble-option-picker.spec.ts src/tests/prf04/furniture-studio-voice-review.spec.ts src/tests/prf04/carga-audio.spec.ts docs/implementacion/PRF03_FURNITURE_STUDIO.md
          if ! git diff --cached --quiet; then
            git commit -m "style(prf03): aplicar Prettier al configurador 2.0"
            git push origin HEAD:feat/furniture-studio-20261102
          fi
