name: Finalize FE05 formatting

on:
  push:
    branches:
      - refactor/fe05-operaciones

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - name: Format FE05 changes
        run: >-
          npx prettier --write
          contracts/backend-openapi.yaml
          docs/implementacion/FE05_OPERACIONES.md
          src/app
          src/modules/movimientos-stock
          src/modules/ordenes-trabajo
          src/modules/proformas
          src/modules/recibos
          src/modules/notas-entrega
          src/shared/api/client.ts
          src/shared/ui/Select.vue
          src/shared/download
          src/tests/fe05
          src/tests/e2e/fe05-operaciones.spec.ts
          src/tests/components
      - name: Update navigation snapshots only
        run: npx vitest run src/tests/components/design-system.spec.ts -u
      - name: Reformat updated snapshots
        run: npx prettier --write src/tests/components
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts docs src
          git commit -m "chore: aplica formato y snapshots FE05"
          git push
