name: Format diagnostic docs

on:
  push:
    branches:
      - refactor/fe04-proformas-manuales

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write docs/implementacion/FE04_PROFORMAS.md
          git diff -- docs/implementacion/FE04_PROFORMAS.md
          exit 1
