name: Generate FE05 API types

on:
  push:
    branches:
      - refactor/fe05-operaciones

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npm run api:generate
      - run: npx prettier --write src/generated/api
      - name: Commit generated types
        run: |
          if git diff --quiet -- src/generated/api; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/api
          git commit -m "chore: regenera tipos API FE05"
          git push
