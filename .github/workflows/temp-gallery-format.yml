name: Temporary gallery formatting diagnostic
on:
  push:
    branches:
      - fix/galerias-ux-recuperacion-20261104
permissions:
  contents: read
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - name: Display exact Prettier formatting patch
        run: |
          npx prettier --write src/modules/productos/views/ProductoDetailView.vue src/shared/media/ImageGallery.vue
          git diff -- src/modules/productos/views/ProductoDetailView.vue src/shared/media/ImageGallery.vue
