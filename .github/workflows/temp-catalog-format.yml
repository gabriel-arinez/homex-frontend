name: Temporary Catalog Formatting Diagnostic
on:
  push:
    branches:
      - feat/proformas-catalogo-ux-integral-20261104
permissions:
  contents: read
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - name: Show Prettier patch
        run: |
          npx prettier --write src/modules/productos/views/ProductosListView.vue src/modules/proformas/components/CatalogoContextual.vue src/modules/proformas/components/DetalleForm.vue src/modules/proformas/views/ProformaDetailView.vue src/modules/proformas/views/ProformaEditorView.vue src/tests/prf02/catalogo-contextual.spec.ts src/tests/fe03/productos-bandeja.spec.ts src/modules/proformas/composables/useQuoteProductImages.ts
          git diff -- src/modules src/tests
