name: Temporary productos editor formatter
on:
  push:
    branches: [feat/productos-bandeja-ux-20261103]
permissions:
  contents: write
jobs:
  format:
    if: "github.event.head_commit.message == 'chore(ci): aplicar formato temporal al editor de productos'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/productos-bandeja-ux-20261103
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Formatear los archivos modificados
        run: |
          npx prettier --write \
            src/modules/productos/components/ProductoForm.vue \
            src/modules/productos/components/CapturaCatalogo.vue \
            src/modules/productos/views/ProductoCreateView.vue \
            src/tests/fe03/catalogo-voz.spec.ts \
            src/tests/fe03/producto-form-ux.spec.ts
      - name: Publicar commit de formato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/modules/productos/components/ProductoForm.vue \
            src/modules/productos/components/CapturaCatalogo.vue \
            src/modules/productos/views/ProductoCreateView.vue \
            src/tests/fe03/catalogo-voz.spec.ts \
            src/tests/fe03/producto-form-ux.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(productos): aplicar Prettier al editor de catálogo"
            git push origin HEAD:feat/productos-bandeja-ux-20261103
          fi
