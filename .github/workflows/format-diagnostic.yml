name: Format diagnostic

on:
  push:
    branches:
      - refactor/fe04-proformas-manuales

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write src/tests/fe04/proformas.spec.ts
          git diff -- src/tests/fe04/proformas.spec.ts
          exit 1
